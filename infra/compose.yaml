# Local development only. Production credentials must be configured separately.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: site
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - site-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  site-postgres:
