openapi: 3.1.0
info:
  title: 后台权限接口草案
  version: 0.1.0
  description: 个人权限覆盖的 HTTP 接口仍为草案。角色、用户角色分配、有效权限查询及全站开关已实现，见 Web 接口。
servers:
  - url: /
tags:
  - name: 用户授权
paths:
  /api/admin/users/{id}/permissions/{key}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/CapabilityKey"
    put:
      operationId: updateUserPermission
      summary: 设置用户个人例外
      tags: [用户授权]
      security: [{ SiteSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/Mode" }
            example: { mode: deny }
      responses:
        "200":
          description: 个人设置与生效结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePermission" }
              example:
                key: image.upload
                featureEnabled: true
                roleRule: allow
                userOverride: deny
                allowed: false
                source: user_override
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    SiteSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: 需为站主。HTTPS 部署时使用带安全前缀的 Cookie。
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 路径对应的角色或站内用户 ID
      schema: { type: string, minLength: 1 }
      example: example_id
    CapabilityKey:
      name: key
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      example: project.submit
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Mode:
      type: string
      enum: [inherit, allow, deny]
    EffectivePermission:
      type: object
      required: [key, featureEnabled, roleRule, userOverride, allowed, source]
      properties:
        key: { type: string }
        featureEnabled: { type: boolean }
        roleRule: { $ref: "#/components/schemas/Mode" }
        userOverride: { $ref: "#/components/schemas/Mode" }
        allowed: { type: boolean }
        source:
          type: string
          enum: [account_banned, feature_disabled, user_override, role, default]
  responses:
    InvalidRequest:
      description: 请求参数无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalidRequest }
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: loginRequired }
    Forbidden:
      description: 无站主管理权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: permissionDenied }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: notFound }
